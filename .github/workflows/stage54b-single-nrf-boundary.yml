name: Stage54B single NRF boundary 2500 3000

on:
  push:
    branches: [experiment/stage54-single-nrf-scale]
    paths:
      - ".github/workflows/stage54b-single-nrf-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: one-NRF-${{ matrix.count }}-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        count: [2500, 3000]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Stage54 boundary driver
        run: |
          cp stage54/stage54_single_nrf.py stage54_boundary.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage54_boundary.py")
          s=p.read_text()
          s=s.replace("1<=args.count<=2000","1<=args.count<=3000")
          s=s.replace("count must be 1..2000 for Stage54 single-NRF scale","count must be 1..3000 for Stage54B boundary")
          p.write_text(s)
          compile(s,"stage54_boundary.py","exec")
          PY

      - name: Build Open5GS 2.7.6 image
        run: docker build -f stage53/Dockerfile -t stage54b-open5gs .

      - name: Run one NRF with ${{ matrix.count }} genuine NSSF
        run: |
          set -euo pipefail
          OUT="stage54b_${{ matrix.count }}"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_before.txt"
          docker run --rm --name "stage54b-${{ matrix.count }}" --network host             --pids-limit=-1             -v "$PWD/$OUT:/out"             -v "$PWD/stage54_boundary.py:/opt/stage54_boundary.py:ro"             stage54b-open5gs             python3 /opt/stage54_boundary.py               --count ${{ matrix.count }}               --worker 0               --hold-seconds 60               --converge-timeout 900               --batch 25               --batch-pause 0.05               --output /out
          cat "$OUT/STAGE54_RESULT.md" >> "$GITHUB_STEP_SUMMARY"
          (cd "$OUT" && sha256sum result.json ready.json uuid_hashes.txt STAGE54_RESULT.md > stage54b_sha256.txt)

      - name: Host diagnostics
        if: always()
        run: |
          OUT="stage54b_${{ matrix.count }}"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_after.txt" || true
          (ulimit -a) > "$OUT/ulimit.txt" 2>&1 || true
          ps -eLf | wc -l > "$OUT/host_thread_count.txt" || true
          docker ps -a > "$OUT/docker_ps.txt" || true
          dmesg | tail -n 120 > "$OUT/dmesg_tail.txt" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54b-single-nrf-${{ matrix.count }}-evidence
          path: stage54b_${{ matrix.count }}/
          retention-days: 90
