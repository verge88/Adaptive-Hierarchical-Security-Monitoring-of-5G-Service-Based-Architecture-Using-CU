name: Stage28 randomized common-source robustness stress

on:
  push:
    branches: ['stage28/randomized-common-source-stress']
    paths:
      - 'live/stage28-nnrf-handler.c'
      - 'live/stage28-nrf.Dockerfile'
      - 'live/stage28-nrf-compose.yaml'
      - 'research/stage28_capture.py'
      - 'research/stage28_attestation.py'
      - 'research/stage28_live_detect.py'
      - 'research/stage28_report.py'
      - 'stage28/**'
      - 'stage28_tests/**'
      - '.github/workflows/stage28-randomized-stress.yml'
  pull_request:
    branches: ['stage27/common-source-software-attestation']
    paths:
      - 'live/stage28-nnrf-handler.c'
      - 'live/stage28-nrf.Dockerfile'
      - 'live/stage28-nrf-compose.yaml'
      - 'research/stage28_capture.py'
      - 'research/stage28_attestation.py'
      - 'research/stage28_live_detect.py'
      - 'research/stage28_report.py'
      - 'stage28/**'
      - 'stage28_tests/**'
      - '.github/workflows/stage28-randomized-stress.yml'
  workflow_dispatch:

concurrency:
  group: stage28-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Run Stage28 tests
        run: |
          python -m compileall -q research stage28_tests
          python -m unittest discover -s stage28_tests -v

  authority:
    needs: static-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen Stage27 authority manifest
        run: |
          python -m research.stage27_authority             --output stage28_authority
      - name: Generate ephemeral Ed25519 key and sign
        run: |
          PRIVATE_KEY="$RUNNER_TEMP/stage28-authority-private.pem"
          openssl genpkey -algorithm ED25519 -out "$PRIVATE_KEY"
          openssl pkey             -in "$PRIVATE_KEY"             -pubout             -out stage28_authority/public.pem
          openssl pkeyutl             -sign             -rawin             -inkey "$PRIVATE_KEY"             -in stage28_authority/manifest.json             -out stage28_authority/manifest.sig
          openssl pkeyutl             -verify             -rawin             -pubin             -inkey stage28_authority/public.pem             -in stage28_authority/manifest.json             -sigfile stage28_authority/manifest.sig
          rm -f "$PRIVATE_KEY"
          test ! -e "$PRIVATE_KEY"
      - name: Prove private key is absent from artifact
        run: |
          if find stage28_authority -type f -iname '*private*' | grep -q .; then
            echo "Private authority key leaked"
            exit 1
          fi
      - name: Upload signed authority material
        uses: actions/upload-artifact@v4
        with:
          name: stage28-authority
          path: stage28_authority/
          retention-days: 30

  capture:
    needs: static-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Validate Stage28 compose
        run: |
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml config -q
      - name: Build instrumented native Open5GS NRF v2.7.6
        run: |
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml build nrf
      - name: Start isolated Open5GS core
        run: |
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml up -d --pull always
      - name: Capture randomized private-plan block
        run: |
          python -m research.stage28_capture             --seed $((9501 + ${{ matrix.shard }}))             --telemetry-output stage28_raw             --labels-output stage28_private_labels
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml ps -a > diagnostics/ps.txt || true
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml logs --no-color > diagnostics/compose.log 2>&1 || true
      - name: Upload label-free raw telemetry
        uses: actions/upload-artifact@v4
        with:
          name: stage28-raw-${{ matrix.shard }}
          path: |
            stage28_raw/
            diagnostics/
          retention-days: 30
      - name: Upload PRIVATE realized schedule and labels separately
        uses: actions/upload-artifact@v4
        with:
          name: stage28-labels-${{ matrix.shard }}
          path: stage28_private_labels/
          retention-days: 30
      - name: Stop disposable Open5GS core
        if: always()
        run: |
          docker compose             -f live/compose.yaml             -f live/stage5-compose.yaml             -f live/stage14-scp-compose.yaml             -f live/stage28-nrf-compose.yaml down --remove-orphans || true

  attestation-project:
    needs: [authority, capture]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Download signed authority material
        uses: actions/download-artifact@v4
        with:
          name: stage28-authority
          path: authority_input
      - name: Download ONLY label-free raw telemetry
        uses: actions/download-artifact@v4
        with:
          name: stage28-raw-${{ matrix.shard }}
          path: raw_input
      - name: Prove private schedule and signing key are absent
        run: |
          if find . ( -name 'private_labels.json' -o -name 'native_nrf_private.log' -o -iname '*private*.pem' ) | grep -q .; then
            echo "Private Stage28 material leaked into verifier"
            exit 1
          fi
      - name: Locate raw telemetry
        id: raw
        run: |
          RAW="$(find raw_input -name raw_telemetry.json -print -quit)"
          test -n "$RAW"
          echo "path=$RAW" >> "$GITHUB_OUTPUT"
      - name: Verify frozen authority and project detector inputs
        run: |
          python -m research.stage28_attestation             --raw-telemetry "${{ steps.raw.outputs.path }}"             --manifest authority_input/manifest.json             --signature authority_input/manifest.sig             --public-key authority_input/public.pem             --output stage28_projected
      - name: Upload verified projected telemetry
        uses: actions/upload-artifact@v4
        with:
          name: stage28-projected-${{ matrix.shard }}
          path: stage28_projected/
          retention-days: 30

  blind-detect:
    needs: attestation-project
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Download ONLY projected telemetry
        uses: actions/download-artifact@v4
        with:
          name: stage28-projected-${{ matrix.shard }}
          path: detector_input
      - name: Prove labels, schedule and signing key are absent
        run: |
          if find detector_input ( -name 'private_labels.json' -o -iname '*private*.pem' ) | grep -q .; then
            echo "Private Stage28 material leaked into blind detector"
            exit 1
          fi
      - name: Run frozen Stage21 detector
        run: |
          python -m research.stage28_live_detect             --attested-telemetry detector_input/attested_telemetry.json             --compromised-pair-telemetry detector_input/compromised_pair_telemetry.json             --output stage28_detector
      - name: Upload blind alarms
        uses: actions/upload-artifact@v4
        with:
          name: stage28-alarms-${{ matrix.shard }}
          path: stage28_detector/
          retention-days: 30

  audit:
    needs: [authority, capture, attestation-project, blind-detect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all Stage28 artifacts after blind detection
        uses: actions/download-artifact@v4
        with:
          pattern: stage28-*
          path: stage28_batches
      - name: Join private randomized schedules post-hoc
        run: |
          python -m research.stage28_report             --input stage28_batches             --output stage28_report
      - name: Publish Stage28 report
        run: cat stage28_report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audited Stage28 result
        uses: actions/upload-artifact@v4
        with:
          name: stage28-randomized-robustness-report
          path: stage28_report/
          retention-days: 90
