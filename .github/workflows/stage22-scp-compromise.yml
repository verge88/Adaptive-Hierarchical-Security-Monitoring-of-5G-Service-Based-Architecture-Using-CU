name: Stage22 SCP compromise boundary validation

on:
  push:
    branches: ['stage22/scp-compromise-boundary']
    paths:
      - 'research/stage22_scp_fault.py'
      - 'research/stage22_capture.py'
      - 'research/stage22_live_detect.py'
      - 'research/stage22_report.py'
      - 'stage22/**'
      - 'stage22_tests/**'
      - '.github/workflows/stage22-scp-compromise.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Run Stage22 boundary tests
        run: |
          python -m compileall -q research stage22_tests
          python -m unittest discover -s stage22_tests -v

  capture:
    needs: static-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Validate native Open5GS compose
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml config -q
      - name: Start genuine Open5GS v2.7.6 NRF NSSF AUSF SCP binaries
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml up -d --pull always
      - name: Verify native NRF registrations
        run: python -m research.nrf_probe --retries 45
      - name: Capture Stage22 SCP-compromise boundary block
        run: |
          python -m research.stage22_capture \
            --seed $((8901 + ${{ matrix.shard }})) \
            --telemetry-output stage22_telemetry \
            --labels-output stage22_private_labels
      - name: Capture Open5GS provenance
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml ps -a > diagnostics/ps.txt || true
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml images > diagnostics/images.txt || true
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml logs --no-color > diagnostics/native_open5gs.log 2>&1 || true
      - name: Upload label-free Stage22 telemetry
        uses: actions/upload-artifact@v4
        with:
          name: stage22-telemetry-${{ matrix.shard }}
          path: |
            stage22_telemetry/
            diagnostics/
          retention-days: 30
      - name: Upload PRIVATE labels separately
        uses: actions/upload-artifact@v4
        with:
          name: stage22-labels-${{ matrix.shard }}
          path: stage22_private_labels/
          retention-days: 30
      - name: Stop disposable Open5GS core
        if: always()
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml down --remove-orphans || true

  blind-detect:
    needs: capture
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ONLY Stage22 telemetry
        uses: actions/download-artifact@v4
        with:
          name: stage22-telemetry-${{ matrix.shard }}
          path: detector_input
      - name: Prove private labels are absent
        run: |
          if find detector_input -name 'private_labels.json' | grep -q .; then
            echo "Private labels leaked into Stage22 detector job"
            exit 1
          fi
      - name: Locate telemetry
        id: telemetry
        run: |
          TELEMETRY="$(find detector_input -name telemetry.json -print -quit)"
          COMMON="$(find detector_input -name common_path_telemetry.json -print -quit)"
          test -n "$TELEMETRY"
          test -n "$COMMON"
          echo "path=$TELEMETRY" >> "$GITHUB_OUTPUT"
          echo "common=$COMMON" >> "$GITHUB_OUTPUT"
      - name: Run frozen Stage21 detector under Stage22 trust boundary
        run: |
          python -m research.stage22_live_detect \
            --telemetry "${{ steps.telemetry.outputs.path }}" \
            --common-path-telemetry "${{ steps.telemetry.outputs.common }}" \
            --output stage22_detector
      - name: Upload blind Stage22 alarms
        uses: actions/upload-artifact@v4
        with:
          name: stage22-alarms-${{ matrix.shard }}
          path: stage22_detector/
          retention-days: 30

  audit:
    needs: [capture, blind-detect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all Stage22 artifacts only after blind detection
        uses: actions/download-artifact@v4
        with:
          pattern: stage22-*
          path: stage22_batches
      - name: Join labels post-hoc and audit trust-boundary effect
        run: python -m research.stage22_report --input stage22_batches --output stage22_report
      - name: Publish Stage22 report
        run: cat stage22_report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audited Stage22 result
        uses: actions/upload-artifact@v4
        with:
          name: stage22-scp-compromise-boundary-report
          path: stage22_report/
          retention-days: 90
