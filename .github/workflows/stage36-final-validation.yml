name: Stage36 final maximum validation

on:
  push:
    branches: ['stage36/final-validation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage36-final-validation
  cancel-in-progress: false

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r live/requirements.txt cryptography h2
      - name: Run frozen Stage35 tests
        run: |
          python -m compileall -q research stage35 stage35_tests
          python -m unittest discover -s stage35_tests -v

  policy-build:
    needs: static-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic frozen policy
        run: python -m research.stage35_policy --output stage36_policy
      - name: Record frozen implementation hashes
        run: |
          mkdir -p stage36_freeze
          {
            echo "stage36_workflow_commit=$GITHUB_SHA"
            echo "stage35_frozen_base=bd89dd851c5ebf1dae21d688dc9976224615e8c9"
            sha256sum               stage35/transition_verifier_service.py               stage35/state_anchor_service.py               stage35/external_testbed/collector_service.py               research/stage35_policy.py               research/stage35_external_client.py               research/stage35_report.py               research/stage35_benchmark_client.py
          } > stage36_freeze/FROZEN_MANIFEST.txt
          cp stage36_policy/policy.sha256 stage36_freeze/policy.sha256
          cat stage36_freeze/FROZEN_MANIFEST.txt
          cat stage36_freeze/policy.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-policy
          path: stage36_policy/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-frozen-manifest
          path: stage36_freeze/
          retention-days: 90

  heldout-live:
    needs: policy-build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      STAGE35_COLLECTOR_ENDPOINT: https://stage35-transition-collector.onrender.com
      STAGE35_VERIFIER_A_ENDPOINT: https://stage35-transition-verifier-a.onrender.com
      STAGE35_VERIFIER_B_ENDPOINT: https://stage35-replay-verifier-b.onrender.com
      STAGE35_ANCHOR_ENDPOINT: https://stage35-freshness-anchor.onrender.com
      STAGE35_POLICY_SHA256: 9faf8018c8dc64de3a40fac3c4afe15cdf4696c32ad6c6af5a79014b99f38128
      STAGE35_COLLECTOR_KEY_SHA256: 7fc5eb661ae0257dd0b417ab83d3cd9ac10a2a1daf2fb7c27c51b170b7df316e
      STAGE35_VERIFIER_KEY_SHA256: 9b8373933e763eed81468065e9ad9b2a5ad40ed2cb01e29de3ee7f37e8d93474
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install signature dependencies
        run: python -m pip install cryptography
      - uses: actions/download-artifact@v4
        with:
          name: stage36-policy
          path: stage36_policy
      - name: Enforce frozen preregistered policy
        run: |
          ACTUAL="$(tr -d '\n' < stage36_policy/policy.sha256)"
          test "$ACTUAL" = "$STAGE35_POLICY_SHA256"
      - name: Warm and verify all Render services
        run: |
          set -euo pipefail
          wait_ready() {
            name="$1"
            url="$2"
            for attempt in $(seq 1 60); do
              echo "readiness $name attempt=$attempt"
              if curl -fsS --connect-timeout 10 --max-time 30 "$url" > "/tmp/${name}.json"; then
                cat "/tmp/${name}.json"
                return 0
              fi
              sleep 5
            done
            echo "$name did not become ready" >&2
            return 1
          }

          wait_ready collector "$STAGE35_COLLECTOR_ENDPOINT/health"
          wait_ready verifier_a "$STAGE35_VERIFIER_A_ENDPOINT/health"
          wait_ready verifier_b "$STAGE35_VERIFIER_B_ENDPOINT/health"
          wait_ready anchor "$STAGE35_ANCHOR_ENDPOINT/health"

          python - <<'PY'
          import json, os, urllib.request

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read())

          collector = get(os.environ["STAGE35_COLLECTOR_ENDPOINT"] + "/public-key")
          verifier = get(os.environ["STAGE35_VERIFIER_A_ENDPOINT"] + "/public-key")
          assert collector["public_key_sha256"] == os.environ["STAGE35_COLLECTOR_KEY_SHA256"]
          assert verifier["public_key_sha256"] == os.environ["STAGE35_VERIFIER_KEY_SHA256"]
          health = get(os.environ["STAGE35_VERIFIER_A_ENDPOINT"] + "/health")
          assert health["verifier_key_origin"] == "render_environment", health
          print("RENDER_READINESS_OK", collector["public_key_sha256"], verifier["public_key_sha256"])
          PY

      - name: Run 768 fresh transition-window experiments
        run: |
          set -euo pipefail
          mkdir -p stage36_evidence stage36_labels stage36_meta
          printf "seed\tattempt\tstatus\tstarted_at\tended_at\n" > stage36_meta/attempts.tsv

          for seed in $(seq 15001 15768); do
            echo "=== Stage36 seed $seed ==="
            ok=0
            for attempt in 1 2 3; do
              started="$(date -u +%FT%TZ)"
              rm -rf "stage36_evidence/$seed" "stage36_labels/$seed"
              if python -m research.stage35_external_client \
                --seed "$seed" \
                --collector-endpoint "$STAGE35_COLLECTOR_ENDPOINT" \
                --verifier-a-endpoint "$STAGE35_VERIFIER_A_ENDPOINT" \
                --policy-sha256-file stage36_policy/policy.sha256 \
                --expected-collector-key-sha256 "$STAGE35_COLLECTOR_KEY_SHA256" \
                --expected-verifier-key-sha256 "$STAGE35_VERIFIER_KEY_SHA256" \
                --output "stage36_evidence/$seed" \
                --labels-output "stage36_labels/$seed"; then
                ended="$(date -u +%FT%TZ)"
                printf "%s\t%s\tsuccess\t%s\t%s\n" "$seed" "$attempt" "$started" "$ended" >> stage36_meta/attempts.tsv
                ok=1
                break
              else
                ended="$(date -u +%FT%TZ)"
                printf "%s\t%s\tfailure\t%s\t%s\n" "$seed" "$attempt" "$started" "$ended" >> stage36_meta/attempts.tsv
                echo "orchestration retry seed=$seed attempt=$attempt" >&2
                sleep 5
              fi
            done
            test "$ok" = 1
          done

          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows=list(csv.DictReader(open("stage36_meta/attempts.tsv"), delimiter="\t"))
          seeds={}
          for r in rows:
              seeds.setdefault(r["seed"], []).append(r)
          total=len(seeds)
          first=sum(1 for rs in seeds.values() if rs and rs[0]["status"]=="success")
          retried=sum(1 for rs in seeds.values() if len(rs)>1)
          failed_attempts=sum(1 for r in rows if r["status"]=="failure")
          summary={
              "runs_requested": 768,
              "runs_completed": total,
              "first_attempt_successes": first,
              "first_attempt_success_rate": first/total if total else 0.0,
              "seeds_retried": retried,
              "failed_attempts": failed_attempts,
              "total_attempts": len(rows),
          }
          Path("stage36_meta/attempt_summary.json").write_text(json.dumps(summary, indent=2)+"\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Prove complete blind evidence and labels
        run: |
          test "$(find stage36_evidence -name evidence.json | wc -l)" -eq 768
          test "$(find stage36_evidence -name signed_verdict.json | wc -l)" -eq 768
          test "$(find stage36_labels -name private_labels.json | wc -l)" -eq 768
          cat stage36_meta/attempt_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-external-evidence
          path: stage36_evidence/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-private-labels
          path: stage36_labels/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-attempt-metadata
          path: stage36_meta/
          retention-days: 90

  benchmark:
    needs: heldout-live
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STAGE35_COLLECTOR_ENDPOINT: https://stage35-transition-collector.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stage36-policy
          path: stage36_policy
      - name: Run 1000-request verifier+anchor benchmark
        run: |
          python -m research.stage35_benchmark_client \
            --collector-endpoint "$STAGE35_COLLECTOR_ENDPOINT" \
            --policy-sha256-file stage36_policy/policy.sha256 \
            --iterations 1000 \
            --output stage36_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-benchmark
          path: stage36_benchmark.json
          retention-days: 90

  audit:
    needs: [heldout-live, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: stage36-external-evidence
          path: stage36_batches/evidence
      - uses: actions/download-artifact@v4
        with:
          name: stage36-private-labels
          path: stage36_batches/labels
      - uses: actions/download-artifact@v4
        with:
          name: stage36-benchmark
          path: stage36_batches/benchmark
      - uses: actions/download-artifact@v4
        with:
          name: stage36-attempt-metadata
          path: stage36_batches/meta
      - uses: actions/download-artifact@v4
        with:
          name: stage36-frozen-manifest
          path: stage36_batches/freeze
      - name: Join labels only after external signed decisions
        run: |
          python -m research.stage35_report \
            --input stage36_batches \
            --benchmark stage36_batches/benchmark/stage36_benchmark.json \
            --output stage36_report
      - name: Append Stage36 provenance and retry statistics
        run: |
          {
            echo
            echo "## Stage36 final validation provenance"
            echo
            echo "- Fresh runs: 768 (seeds 15001..15768)"
            echo "- Attack schedule/detector/verifier logic: frozen from Stage35 commit bd89dd851c5ebf1dae21d688dc9976224615e8c9"
            echo "- Benchmark requests: 1000"
            echo
            echo "### Attempt statistics"
            echo
            echo '~~~json'
            cat stage36_batches/meta/attempt_summary.json
            echo '~~~'
            echo
            echo "### Frozen source manifest"
            echo
            echo '~~~text'
            cat stage36_batches/freeze/FROZEN_MANIFEST.txt
            echo '~~~'
          } >> stage36_report/REPORT.md
      - name: Publish Stage36 report
        run: cat stage36_report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage36-final-validation-report
          path: stage36_report/
          retention-days: 90
