name: Stage54D single NRF 4000 with extra swap

on:
  push:
    branches: [experiment/stage54-single-nrf-scale]
    paths:
      - ".github/workflows/stage54d-single-nrf-4000-swap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-nrf-4000:
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - name: Prepare 4000-NF driver
        run: |
          cp stage54/stage54_single_nrf.py stage54d_4000.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage54d_4000.py")
          s=p.read_text()
          s=s.replace("1<=args.count<=2000","1<=args.count<=4000")
          s=s.replace("count must be 1..2000 for Stage54 single-NRF scale","count must be 1..4000 for Stage54D")
          p.write_text(s)
          compile(s,"stage54d_4000.py","exec")
          PY

      - name: Add 8 GiB swap to isolate NRF from host-RAM limit
        run: |
          set -euo pipefail
          mkdir -p stage54d_4000
          free -b | tee stage54d_4000/host_memory_before_swap.txt
          cat /proc/swaps | tee stage54d_4000/swaps_before.txt
          sudo fallocate -l 8G /mnt/stage54-extra.swap
          sudo chmod 600 /mnt/stage54-extra.swap
          sudo mkswap /mnt/stage54-extra.swap
          sudo swapon /mnt/stage54-extra.swap
          free -b | tee stage54d_4000/host_memory_after_swap.txt
          cat /proc/swaps | tee stage54d_4000/swaps_after_add.txt

      - name: Build Open5GS 2.7.6 image
        run: docker build -f stage53/Dockerfile -t stage54d-open5gs .

      - name: Run one NRF with 4000 genuine NSSF
        run: |
          set -uo pipefail
          OUT="stage54d_4000"
          NAME="stage54d-4000"
          docker run --name "$NAME" --network host             --pids-limit=-1             -v "$PWD/$OUT:/out"             -v "$PWD/stage54d_4000.py:/opt/stage54d_4000.py:ro"             stage54d-open5gs             python3 /opt/stage54d_4000.py               --count 4000               --worker 0               --hold-seconds 60               --converge-timeout 1800               --batch 25               --batch-pause 0.05               --output /out
          RC=$?
          echo "$RC" > "$OUT/docker_exit_code.txt"
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state.json" 2>&1 || true
          if [ "$RC" -eq 0 ]; then
            cat "$OUT/STAGE54_RESULT.md" >> "$GITHUB_STEP_SUMMARY"
            (cd "$OUT" && sha256sum result.json ready.json uuid_hashes.txt STAGE54_RESULT.md > stage54d_sha256.txt)
          fi
          exit "$RC"

      - name: Diagnostics and swap accounting
        if: always()
        run: |
          OUT="stage54d_4000"
          NAME="stage54d-4000"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_after_run.txt" || true
          cat /proc/swaps > "$OUT/swaps_after_run.txt" || true
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state_after.json" 2>&1 || true
          docker logs "$NAME" --tail 500 > "$OUT/container_log_tail.txt" 2>&1 || true
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          sudo swapoff /mnt/stage54-extra.swap || true
          sudo rm -f /mnt/stage54-extra.swap || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54d-single-nrf-4000-extra-swap-evidence
          path: stage54d_4000/
          retention-days: 90
