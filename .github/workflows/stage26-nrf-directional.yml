name: Stage26 NRF persistent phantom directional validation

on:
  push:
    branches: ['stage26/nrf-directional-persistent-phantom']
    paths:
      - 'live/stage26-nnrf-handler.c'
      - 'live/stage26-nrf.Dockerfile'
      - 'live/stage26-nrf-compose.yaml'
      - 'research/stage26_capture.py'
      - 'research/stage26_live_detect.py'
      - 'research/stage26_report.py'
      - 'stage26/**'
      - 'stage26_tests/**'
      - '.github/workflows/stage26-nrf-directional.yml'
  pull_request:
    branches: ['stage25/nrf-full-multichannel-witness']
    paths:
      - 'live/stage26-nnrf-handler.c'
      - 'live/stage26-nrf.Dockerfile'
      - 'live/stage26-nrf-compose.yaml'
      - 'research/stage26_capture.py'
      - 'research/stage26_live_detect.py'
      - 'research/stage26_report.py'
      - 'stage26/**'
      - 'stage26_tests/**'
      - '.github/workflows/stage26-nrf-directional.yml'
  workflow_dispatch:

concurrency:
  group: stage26-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Run Stage26 tests
        run: |
          python -m compileall -q research stage26_tests
          python -m unittest discover -s stage26_tests -v

  capture:
    needs: static-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Validate Stage26 compose
        run: |
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml config -q
      - name: Build instrumented native Open5GS NRF v2.7.6
        run: |
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml build nrf
      - name: Start isolated Open5GS core with stock SCP
        run: |
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml up -d --pull always
      - name: Capture Stage26 persistent phantom block
        run: |
          python -m research.stage26_capture \
            --seed $((9301 + ${{ matrix.shard }})) \
            --telemetry-output stage26_telemetry \
            --labels-output stage26_private_labels
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml ps -a > diagnostics/ps.txt || true
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml logs --no-color > diagnostics/compose.log 2>&1 || true
      - name: Upload label-free Stage26 telemetry
        uses: actions/upload-artifact@v4
        with:
          name: stage26-telemetry-${{ matrix.shard }}
          path: |
            stage26_telemetry/
            diagnostics/
          retention-days: 30
      - name: Upload PRIVATE Stage26 labels and NRF audit separately
        uses: actions/upload-artifact@v4
        with:
          name: stage26-labels-${{ matrix.shard }}
          path: stage26_private_labels/
          retention-days: 30
      - name: Stop disposable Open5GS core
        if: always()
        run: |
          docker compose \
            -f live/compose.yaml \
            -f live/stage5-compose.yaml \
            -f live/stage14-scp-compose.yaml \
            -f live/stage26-nrf-compose.yaml down --remove-orphans || true

  blind-detect:
    needs: capture
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Download ONLY Stage26 telemetry
        uses: actions/download-artifact@v4
        with:
          name: stage26-telemetry-${{ matrix.shard }}
          path: detector_input
      - name: Prove private labels and native NRF audit are absent
        run: |
          if find detector_input \( -name 'private_labels.json' -o -name 'native_nrf_private.log' \) | grep -q .; then
            echo "Private Stage26 material leaked into blind detector"
            exit 1
          fi
      - name: Locate label-free telemetry
        id: telemetry
        run: |
          TELEMETRY="$(find detector_input -name telemetry.json -print -quit)"
          COMMON="$(find detector_input -name common_path_telemetry.json -print -quit)"
          test -n "$TELEMETRY"
          test -n "$COMMON"
          echo "path=$TELEMETRY" >> "$GITHUB_OUTPUT"
          echo "common=$COMMON" >> "$GITHUB_OUTPUT"
      - name: Run frozen Stage21 multichannel detector
        run: |
          python -m research.stage26_live_detect \
            --telemetry "${{ steps.telemetry.outputs.path }}" \
            --common-path-telemetry "${{ steps.telemetry.outputs.common }}" \
            --output stage26_detector
      - name: Upload blind Stage26 alarms
        uses: actions/upload-artifact@v4
        with:
          name: stage26-alarms-${{ matrix.shard }}
          path: stage26_detector/
          retention-days: 30

  audit:
    needs: [capture, blind-detect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Stage26 artifacts after blind detection
        uses: actions/download-artifact@v4
        with:
          pattern: stage26-*
          path: stage26_batches
      - name: Join labels and native-NRF provenance post-hoc
        run: |
          python -m research.stage26_report \
            --input stage26_batches \
            --output stage26_report
      - name: Publish Stage26 report
        run: cat stage26_report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audited Stage26 result
        uses: actions/upload-artifact@v4
        with:
          name: stage26-nrf-directional-report
          path: stage26_report/
          retention-days: 90
