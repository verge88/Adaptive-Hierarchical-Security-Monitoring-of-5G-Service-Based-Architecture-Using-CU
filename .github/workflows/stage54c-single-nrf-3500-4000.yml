name: Stage54C single NRF 3500 4000 resource boundary

on:
  push:
    branches: [experiment/stage54-single-nrf-scale]
    paths:
      - ".github/workflows/stage54c-single-nrf-3500-4000.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    name: one-NRF-${{ matrix.count }}-resource-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        count: [3500, 4000]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare boundary driver
        run: |
          cp stage54/stage54_single_nrf.py stage54c_boundary.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage54c_boundary.py")
          s=p.read_text()
          s=s.replace("1<=args.count<=2000","1<=args.count<=4000")
          s=s.replace("count must be 1..2000 for Stage54 single-NRF scale","count must be 1..4000 for Stage54C boundary")
          p.write_text(s)
          compile(s,"stage54c_boundary.py","exec")
          PY

      - name: Build Open5GS 2.7.6 image
        run: docker build -f stage53/Dockerfile -t stage54c-open5gs .

      - name: Run one NRF with ${{ matrix.count }} genuine NSSF
        run: |
          set -uo pipefail
          OUT="stage54c_${{ matrix.count }}"
          NAME="stage54c-${{ matrix.count }}"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_before.txt"
          cat /proc/swaps > "$OUT/swaps_before.txt" || true
          docker run --name "$NAME" --network host             --pids-limit=-1             -v "$PWD/$OUT:/out"             -v "$PWD/stage54c_boundary.py:/opt/stage54c_boundary.py:ro"             stage54c-open5gs             python3 /opt/stage54c_boundary.py               --count ${{ matrix.count }}               --worker 0               --hold-seconds 60               --converge-timeout 1200               --batch 25               --batch-pause 0.05               --output /out
          RC=$?
          echo "$RC" > "$OUT/docker_exit_code.txt"
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state.json" 2>&1 || true
          if [ "$RC" -eq 0 ]; then
            cat "$OUT/STAGE54_RESULT.md" >> "$GITHUB_STEP_SUMMARY"
            (cd "$OUT" && sha256sum result.json ready.json uuid_hashes.txt STAGE54_RESULT.md > stage54c_sha256.txt)
          fi
          exit "$RC"

      - name: Host diagnostics
        if: always()
        run: |
          OUT="stage54c_${{ matrix.count }}"
          NAME="stage54c-${{ matrix.count }}"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_after.txt" || true
          cat /proc/swaps > "$OUT/swaps_after.txt" || true
          (ulimit -a) > "$OUT/ulimit.txt" 2>&1 || true
          ps -eLf | wc -l > "$OUT/host_thread_count.txt" || true
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state_after.json" 2>&1 || true
          docker logs "$NAME" --tail 300 > "$OUT/container_log_tail.txt" 2>&1 || true
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          dmesg | tail -n 120 > "$OUT/dmesg_tail.txt" 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54c-single-nrf-${{ matrix.count }}-evidence
          path: stage54c_${{ matrix.count }}/
          retention-days: 90
