name: Stage33 final independent external verifier

on:
  push:
    branches: ['stage33/final-external-verifier']
  pull_request:
    branches: ['stage32/external-kms-root']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r live/requirements.txt cryptography
      - run: |
          python -m compileall -q research stage33 stage33_tests
          python -m unittest discover -s stage33_tests -v

  policy-build:
    needs: static-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m research.stage33_policy --output stage33_policy
      - name: Publish approved policy digest
        run: |
          cat stage33_policy/policy.sha256
          echo "### Stage33 policy SHA-256" >> "$GITHUB_STEP_SUMMARY"
          cat stage33_policy/policy.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage33-policy
          path: stage33_policy/
          retention-days: 90
