name: Stage20 competitive evidence development

on:
  push:
    branches: ['stage20/competitive-directional-e']
    paths:
      - 'research/stage20_*.py'
      - 'stage20/**'
      - 'stage20_tests/**'
      - '.github/workflows/stage20-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run Stage20 invariants
        run: |
          python -m compileall -q research stage20_tests
          python -m unittest discover -s stage20_tests -v
      - name: Select competitive detector across randomized environments
        run: |
          python -m research.stage20_develop \
            --start-seed 11001 \
            --seeds 60 \
            --output stage20_development.json
      - name: Publish development summary
        run: cat stage20_development.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage20-development
          path: stage20_development.json
          retention-days: 30
