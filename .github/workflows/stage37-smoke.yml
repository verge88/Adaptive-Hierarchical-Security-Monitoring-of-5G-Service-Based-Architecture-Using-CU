name: Stage37 randomized topology smoke

on:
  push:
    branches: ['stage37/randomized-topology']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage37-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGE37_COLLECTOR_ENDPOINT: https://stage37-randomized-collector.onrender.com
      STAGE37_VERIFIER_A_ENDPOINT: https://stage37-randomized-verifier-a.onrender.com
      STAGE37_VERIFIER_B_ENDPOINT: https://stage37-randomized-verifier-b.onrender.com
      STAGE37_ANCHOR_ENDPOINT: https://stage37-randomized-anchor.onrender.com
      STAGE37_POLICY_SHA256: f6190f91733160795e7bec76b2147b13fc3b86174688f57850ee9a54655009d9
      STAGE37_COLLECTOR_KEY_SHA256: db868f9359b371e8d58f04659c8870720ddf94e0a60d3f4fd2819466589b58f4
      STAGE37_VERIFIER_KEY_SHA256: 8e3b82e5209ce8abc8c7b1161d8423f2384b86cf0c67900b4d291682e3c8bd11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install cryptography h2
      - name: Compile Stage37 Python
        run: |
          python -m compileall -q stage37 research/stage37_*.py
      - name: Build and verify frozen policy
        run: |
          python -m research.stage37_policy --output stage37_policy
          ACTUAL="$(tr -d '\n' < stage37_policy/policy.sha256)"
          test "$ACTUAL" = "$STAGE37_POLICY_SHA256"
      - name: Warm all Stage37 Render services
        run: |
          set -euo pipefail
          wait_ready() {
            name="$1"; url="$2"
            for attempt in $(seq 1 180); do
              echo "readiness $name attempt=$attempt"
              if curl -fsS --connect-timeout 10 --max-time 30 "$url" > "/tmp/$name.json"; then
                cat "/tmp/$name.json"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          wait_ready anchor "$STAGE37_ANCHOR_ENDPOINT/health"
          wait_ready verifier_a "$STAGE37_VERIFIER_A_ENDPOINT/health"
          wait_ready verifier_b "$STAGE37_VERIFIER_B_ENDPOINT/health"
          wait_ready collector "$STAGE37_COLLECTOR_ENDPOINT/health"
          python - <<'PY'
          import json, os, urllib.request
          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.loads(r.read())
          c=get(os.environ["STAGE37_COLLECTOR_ENDPOINT"]+"/public-key")
          v=get(os.environ["STAGE37_VERIFIER_A_ENDPOINT"]+"/public-key")
          assert c["public_key_sha256"] == os.environ["STAGE37_COLLECTOR_KEY_SHA256"], c
          assert v["public_key_sha256"] == os.environ["STAGE37_VERIFIER_KEY_SHA256"], v
          print("STAGE37_READINESS_OK")
          PY
      - name: Run four non-final topology smoke seeds
        run: |
          set -euo pipefail
          mkdir -p stage37_smoke/evidence stage37_smoke/labels
          for seed in 16991 16992 16993 16994; do
            ok=0
            for attempt in 1 2; do
              rm -rf "stage37_smoke/evidence/$seed" "stage37_smoke/labels/$seed"
              if python -m research.stage37_external_client                 --seed "$seed"                 --collector-endpoint "$STAGE37_COLLECTOR_ENDPOINT"                 --verifier-a-endpoint "$STAGE37_VERIFIER_A_ENDPOINT"                 --policy-sha256-file stage37_policy/policy.sha256                 --expected-collector-key-sha256 "$STAGE37_COLLECTOR_KEY_SHA256"                 --expected-verifier-key-sha256 "$STAGE37_VERIFIER_KEY_SHA256"                 --output "stage37_smoke/evidence/$seed"                 --labels-output "stage37_smoke/labels/$seed"; then
                ok=1; break
              fi
              sleep 3
            done
            test "$ok" = 1
          done
      - name: Audit smoke coverage
        run: |
          python -m research.stage37_report             --input stage37_smoke             --output stage37_smoke/report             --seed-start 16991             --seed-end 16994
          cat stage37_smoke/report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage37-randomized-smoke
          path: stage37_smoke/
          retention-days: 30
