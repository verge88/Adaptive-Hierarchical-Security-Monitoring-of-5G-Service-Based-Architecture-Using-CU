name: Stage54E single NRF 4000 tuned SBI pools

on:
  push:
    branches: [experiment/stage54-single-nrf-scale]
    paths:
      - ".github/workflows/stage54e-single-nrf-4000-tuned-pools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tuned-4000:
    runs-on: ubuntu-24.04
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - name: Prepare 4000-NF driver with enlarged NRF SBI pools
        run: |
          cp stage54/stage54_single_nrf.py stage54e_4000.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("stage54e_4000.py")
          s=p.read_text()
          s=s.replace("1<=args.count<=2000","1<=args.count<=4000")
          s=s.replace("count must be 1..2000 for Stage54 single-NRF scale",
                      "count must be 1..4000 for Stage54E")
          s=s.replace("peer_limit=max(4096,args.count+512)",
                      "peer_limit=max(8192,args.count+2048)")
          old_nrf = """global:
            max:
              peer: {peer_limit}
          nrf:
          """
          new_nrf = """global:
            max:
              ue: 8192
              peer: {peer_limit}
          nrf:
          """
          old_scp = """global:
            max:
              peer: {peer_limit}
          scp:
          """
          new_scp = """global:
            max:
              ue: 8192
              peer: {peer_limit}
          scp:
          """
          if old_nrf not in s or old_scp not in s:
              raise SystemExit("NRF/SCP global.max patch marker not found")
          s=s.replace(old_nrf,new_nrf,1).replace(old_scp,new_scp,1)
          p.write_text(s)
          compile(s,"stage54e_4000.py","exec")
          PY
          grep -A8 -n 'def nrf_config' stage54e_4000.py

      - name: Add 8 GiB swap
        run: |
          set -euo pipefail
          mkdir -p stage54e_4000
          free -b > stage54e_4000/host_memory_before_swap.txt
          cat /proc/swaps > stage54e_4000/swaps_before.txt
          sudo fallocate -l 8G /mnt/stage54e-extra.swap
          sudo chmod 600 /mnt/stage54e-extra.swap
          sudo mkswap /mnt/stage54e-extra.swap
          sudo swapon /mnt/stage54e-extra.swap
          free -b > stage54e_4000/host_memory_after_swap.txt
          cat /proc/swaps > stage54e_4000/swaps_after_add.txt

      - name: Build Open5GS 2.7.6 image
        run: docker build -f stage53/Dockerfile -t stage54e-open5gs .

      - name: Run one tuned NRF with 4000 genuine NSSF
        run: |
          set -uo pipefail
          OUT="stage54e_4000"
          NAME="stage54e-4000"
          docker run --name "$NAME" --network host             --pids-limit=-1             -v "$PWD/$OUT:/out"             -v "$PWD/stage54e_4000.py:/opt/stage54e_4000.py:ro"             stage54e-open5gs             python3 /opt/stage54e_4000.py               --count 4000 --worker 0               --hold-seconds 60               --converge-timeout 1800               --batch 25 --batch-pause 0.05               --output /out
          RC=$?
          echo "$RC" > "$OUT/docker_exit_code.txt"
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state.json" 2>&1 || true
          if [ "$RC" -eq 0 ]; then
            cat "$OUT/STAGE54_RESULT.md" >> "$GITHUB_STEP_SUMMARY"
            (cd "$OUT" && sha256sum result.json ready.json uuid_hashes.txt STAGE54_RESULT.md > stage54e_sha256.txt)
          fi
          exit "$RC"

      - name: Diagnostics
        if: always()
        run: |
          OUT="stage54e_4000"
          NAME="stage54e-4000"
          mkdir -p "$OUT"
          free -b > "$OUT/host_memory_after_run.txt" || true
          cat /proc/swaps > "$OUT/swaps_after_run.txt" || true
          docker inspect "$NAME" --format '{{json .State}}' > "$OUT/container_state_after.json" 2>&1 || true
          docker logs "$NAME" --tail 500 > "$OUT/container_log_tail.txt" 2>&1 || true
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          sudo swapoff /mnt/stage54e-extra.swap || true
          sudo rm -f /mnt/stage54e-extra.swap || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage54e-single-nrf-4000-tuned-pools-evidence
          path: stage54e_4000/
          retention-days: 90
