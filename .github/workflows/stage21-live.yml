name: Stage21 blind semantic Open5GS validation

on:
  push:
    branches: ['stage21/semantic-integrity']
    paths:
      - 'research/stage21_gateway.py'
      - 'research/stage21_capture.py'
      - 'research/stage21_live_detect.py'
      - 'research/stage21_report.py'
      - 'stage21_tests/**'
      - '.github/workflows/stage21-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Run Stage21 frozen-protocol tests
        run: |
          python -m compileall -q research stage21_tests
          python -m unittest discover -s stage21_tests -v

  capture:
    needs: static-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Validate native Open5GS SCP compose
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml config -q
      - name: Start genuine Open5GS v2.7.6 NRF NSSF AUSF SCP binaries
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml up -d --pull always
      - name: Verify native NRF registrations
        run: python -m research.nrf_probe --retries 45
      - name: Capture untouched randomized Stage21 live block
        run: |
          python -m research.stage21_capture             --seed $((8401 + ${{ matrix.shard }}))             --telemetry-output stage21_telemetry             --labels-output stage21_private_labels
      - name: Capture Open5GS provenance
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml ps -a > diagnostics/ps.txt || true
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml images > diagnostics/images.txt || true
          docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml logs --no-color > diagnostics/native_open5gs.log 2>&1 || true
      - name: Upload label-free semantic telemetry
        uses: actions/upload-artifact@v4
        with:
          name: stage21-telemetry-${{ matrix.shard }}
          path: |
            stage21_telemetry/
            diagnostics/
          retention-days: 30
      - name: Upload PRIVATE labels separately
        uses: actions/upload-artifact@v4
        with:
          name: stage21-labels-${{ matrix.shard }}
          path: stage21_private_labels/
          retention-days: 30
      - name: Stop disposable Open5GS core
        if: always()
        run: docker compose -f live/compose.yaml -f live/stage5-compose.yaml -f live/stage14-scp-compose.yaml down --remove-orphans || true

  blind-detect:
    needs: capture
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ONLY Stage21 telemetry
        uses: actions/download-artifact@v4
        with:
          name: stage21-telemetry-${{ matrix.shard }}
          path: detector_input
      - name: Prove private labels are absent
        run: |
          if find detector_input -name 'private_labels.json' | grep -q .; then
            echo "Private labels leaked into Stage21 detector job"
            exit 1
          fi
      - name: Locate telemetry
        id: telemetry
        run: |
          TELEMETRY="$(find detector_input -name telemetry.json -print -quit)"
          test -n "$TELEMETRY"
          echo "path=$TELEMETRY" >> "$GITHUB_OUTPUT"
      - name: Run frozen Stage21 detector blind
        run: |
          python -m research.stage21_live_detect             --telemetry "${{ steps.telemetry.outputs.path }}"             --output stage21_detector
      - name: Upload blind alarms
        uses: actions/upload-artifact@v4
        with:
          name: stage21-alarms-${{ matrix.shard }}
          path: stage21_detector/
          retention-days: 30

  audit:
    needs: [capture, blind-detect]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all Stage21 artifacts only after blind detection
        uses: actions/download-artifact@v4
        with:
          pattern: stage21-*
          path: stage21_batches
      - name: Join labels post-hoc and compute runner-cluster effects
        run: python -m research.stage21_report --input stage21_batches --output stage21_report
      - name: Publish Stage21 report
        run: cat stage21_report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload audited Stage21 result
        uses: actions/upload-artifact@v4
        with:
          name: stage21-blind-semantic-open5gs-report
          path: stage21_report/
          retention-days: 90
