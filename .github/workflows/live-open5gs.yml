name: Open5GS NRF + live HTTP2 CU overlay experiment

on:
  push:
    branches: [main, 'experiment/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open5gs-live-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP/2 transport
        run: python -m pip install -r live/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q research live_tests
      - name: Test CU authentication and actual HTTP/2 frame transport
        run: python -m unittest discover -s live_tests -v
      - name: Launch real Open5GS NRF, AUSF and NSSF
        run: docker compose -f live/compose.yaml up -d --pull always
      - name: Require real NRF discovery via HTTP/2
        run: python -m research.nrf_probe --retries 45
      - name: Run matched-seed CU monitoring on HTTP/2 sidecars
        run: python -m research.live_experiment --seeds 6 --output live_results
      - name: Include findings and scientific limitations in run summary
        if: success()
        run: cat live_results/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Collect Open5GS diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose -f live/compose.yaml ps -a > diagnostics/compose-ps.txt || true
          docker compose -f live/compose.yaml logs --no-color > diagnostics/open5gs.log 2>&1 || true
      - name: Upload raw live-overlay results and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open5gs-nrf-http2-cu-overlay
          path: |
            live_results/
            diagnostics/
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown isolated Open5GS containers
        if: always()
        run: docker compose -f live/compose.yaml down --remove-orphans || true
