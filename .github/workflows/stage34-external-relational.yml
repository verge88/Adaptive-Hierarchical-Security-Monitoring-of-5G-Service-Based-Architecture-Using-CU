name: Stage34 external relational collector experiment

on:
  push:
    branches: ['stage34/external-relational-collector']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r live/requirements.txt cryptography h2
      - name: Run Stage34 tests
        run: |
          python -m compileall -q research stage34 stage34_tests
          python -m unittest discover -s stage34_tests -v

  policy-build:
    needs: static-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic Stage34 policy
        run: python -m research.stage34_policy --output stage34_policy
      - name: Publish policy digest
        run: |
          cat stage34_policy/policy.sha256
          echo "### Stage34 policy SHA-256" >> "$GITHUB_STEP_SUMMARY"
          cat stage34_policy/policy.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stage34-policy
          path: stage34_policy/
          retention-days: 90
