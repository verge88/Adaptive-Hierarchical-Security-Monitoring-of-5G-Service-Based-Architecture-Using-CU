logger:
  level: info
  file:
    path: /var/log/open5gs/amf2.log
global:
amf:
  sbi:
    server:
      - address: 127.0.0.19
        port: 80
    client:
      nrf:
        - uri: http://127.0.0.10:80
  ngap:
    server:
      - address: 127.0.0.19
  metrics:
    server:
      - address: 127.0.0.19
        port: 9090
  guami:
    - plmn_id:
        mcc: 999
        mnc: 70
      amf_id:
        region: 2
        set: 2
  tai:
    - plmn_id:
        mcc: 999
        mnc: 70
      tac: 2
  plmn_support:
    - plmn_id:
        mcc: 999
        mnc: 70
      s_nssai:
        - sst: 1
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA1, NEA2]
  network_name:
    full: Open5GS-Stage38-B
    short: S38B
  amf_name: stage38-amf2
